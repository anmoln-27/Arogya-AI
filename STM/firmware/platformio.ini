; PlatformIO Project Configuration File for Smart-ASHA on NUCLEO-H533RE
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_h533re]
platform = ststm32
board = nucleo_h533re
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = default, time

; Build Flags for Arm Cortex-M33 DSP & Hardware FPU
build_flags =
    -DSTM32H533xx
    -DARM_MATH_CM33
    -D__FPU_PRESENT=1
    -DUSE_HAL_DRIVER
    -O2

; External Libraries required for Smart-ASHA
lib_deps =
    olikraus/U8g2 @ ^2.35.9
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    adafruit/Adafruit MLX90640 @ ^1.1.1
    adafruit/Adafruit AS7341 @ ^1.4.1
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    stm32duino/STM32FreeRTOS @ ^10.3.2

; Upload Protocol
upload_protocol = stlink

